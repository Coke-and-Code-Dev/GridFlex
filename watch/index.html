<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Watch how GridFlex helps businesses plan fleet charging around their existing grid connection.">
  <title>Watch the GridFlex pitch</title>
  <link rel="icon" type="image/png" href="../ui/public/gridflex-mark.png">
  <style>
    :root { color-scheme: dark; --background: #14131a; --text: #f7f7f8; --yellow: #ffe600; --muted: #bdbbc8; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--background); color: var(--text); font: 1rem/1.55 system-ui, sans-serif; }
    main { width: min(100% - 2rem, 960px); margin: 0 auto; padding: clamp(1.5rem, 5vw, 4rem) 0; }
    a { color: var(--yellow); text-underline-offset: .2em; }
    a:focus-visible, video:focus-visible { outline: 2px solid var(--yellow); outline-offset: 4px; }
    .brand { display: inline-flex; align-items: center; gap: .65rem; color: var(--text); font-weight: 700; text-decoration: none; }
    .brand img { border-radius: .25rem; }
    h1 { margin: 1.5rem 0 .5rem; font-size: clamp(2rem, 6vw, 3.5rem); line-height: 1.1; }
    p { color: var(--muted); }
    video { display: block; width: 100%; aspect-ratio: 16 / 9; margin: 1.5rem 0 1rem; background: #000; border: 1px solid #41404c; border-radius: .75rem; }
  </style>
</head>
<body>
  <main>
    <a class="brand" href="../" aria-label="Back to the GridFlex website">
      <img src="../ui/public/gridflex-mark.png" width="40" height="27" alt=""> GridFlex
    </a>
    <h1>Watch the GridFlex pitch</h1>
    <p>Can your business charge more vans on the grid connection it already has?</p>
    <video controls playsinline preload="metadata" aria-label="GridFlex pitch video">
      <source src="../media/gridflex-pitch.mp4" type="video/mp4">
      Your browser does not support embedded video.
    </video>
    <p><a href="../media/gridflex-pitch.mp4">Open the video file</a> · <a href="../">Back to the website</a></p>
  </main>
</body>
</html>
